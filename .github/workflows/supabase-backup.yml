name: Supabase database backup

on:
  schedule:
    # Every day at 03:17 UTC / 07:17 Asia/Dubai.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out backup script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: '3.0.0'

      - name: Export, verify, and encrypt database backup
        shell: bash
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
          BACKUP_OUTPUT_DIR: ${{ runner.temp }}/supabase-backups
        run: bash .github/scripts/backup-supabase.sh

      - name: Save encrypted backup for 30 days
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: supabase-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/supabase-backups/*.tar.gz.gpg
            ${{ runner.temp }}/supabase-backups/*.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Record backup location
        shell: bash
        run: |
          {
            echo '### Supabase backup completed'
            echo 'Download the encrypted backup from the artifacts on this run.'
            echo 'Retention: 30 days. Decrypt with your separately saved backup password.'
          } >> "$GITHUB_STEP_SUMMARY"
